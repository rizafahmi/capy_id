name: Check Capyboard

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Validate immutable history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA:content/integrity.json" 2>/dev/null; then
            git show "$BASE_SHA:content/integrity.json" > "$RUNNER_TEMP/prior-integrity.json"
            npm run validate -- --prior-integrity "$RUNNER_TEMP/prior-integrity.json"
          else
            npm run validate
          fi
      - run: npm exec playwright install chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
          if-no-files-found: ignore
