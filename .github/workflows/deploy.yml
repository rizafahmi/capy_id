name: Deploy Capyboard

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build and Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run check

      - name: Validate content
        run: npm run validate

      - name: Build static gallery and preview sites
        env:
          GALLERY_ORIGIN: https://capy.ai.id
          PREVIEW_ORIGIN: https://preview.capy.ai.id
        run: |
          npm run build -- \
            --gallery-origin "$GALLERY_ORIGIN" \
            --preview-origin "$PREVIEW_ORIGIN"

      - name: Deploy Preview site to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/preview --project-name=capyboard-preview

      - name: Deploy Gallery site to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist/gallery --project-name=capyboard-gallery

      - name: Verify Live Deployment
        env:
          GALLERY_ORIGIN: https://capy.ai.id
          PREVIEW_ORIGIN: https://preview.capy.ai.id
        run: |
          npm run verify:deployment -- \
            --gallery-origin "$GALLERY_ORIGIN" \
            --preview-origin "$PREVIEW_ORIGIN"
